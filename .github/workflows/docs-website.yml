name: Documentation website build
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  website:
    name: Documentation website build
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghostnet-linux-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: docs/Gemfile
      - name: Build website
        run: bundle exec jekyll build --source docs --destination _site
        env:
          JEKYLL_ENV: production
          BUNDLE_GEMFILE: docs/Gemfile
