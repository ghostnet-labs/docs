name: Documentation website build
on:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    name: Documentation website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: docs/Gemfile
      - name: Build website
        run: bundle exec jekyll build --source docs --destination _site
        env:
          JEKYLL_ENV: production
          BUNDLE_GEMFILE: docs/Gemfile
