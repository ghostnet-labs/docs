name: Documentation website build
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  studio:
    # Which Mac Studio runner pools are online. While one is offline the jobs
    # below use their GitHub-hosted fallback (docs tools/studio-runners).
    name: Studio runners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      mac: ${{ steps.pick.outputs.mac }}
      arc: ${{ steps.pick.outputs.arc }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        uses: ghostnet-labs/docs/.github/actions/studio-runners@2fbbfffa8f552c996157e4ae97dcfc6fde490419
        with:
          runner-token: ${{ secrets.RUNNER_READ_TOKEN }}
  website:
    name: Documentation website build
    needs: studio
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.studio.outputs.arc != 'false' && 'ghostnet-linux-arm64' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: docs/Gemfile
      - name: Build website
        run: bundle exec jekyll build --source docs --destination _site
        env:
          JEKYLL_ENV: production
          BUNDLE_GEMFILE: docs/Gemfile
