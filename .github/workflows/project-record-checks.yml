name: Project record checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    name: Project record validation
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          # Self-hosted runners keep a tool cache; without this "3.x" can
          # resolve to an old cached Python (3.8 from another repo's job).
          check-latest: true
      - name: GPIO allocation consistency
        run: python project/scripts/check_gpio_allocations.py
      - name: Agent instruction links
        run: python project/scripts/check_agents.py
      - name: Merge policy regression tests
        run: python -m unittest discover -s project/tests -v
