name: Manet merge gate
on:
  pull_request:
    # closed: a new run in the same concurrency group cancels any gate still
    # waiting on a PR that was just merged or closed; the job itself is skipped.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, closed]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: manet-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  studio:
    # Which Mac Studio runner pools are online. While one is offline the jobs
    # below use their GitHub-hosted fallback (docs tools/studio-runners).
    name: Studio runners
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      mac: ${{ steps.pick.outputs.mac }}
      arc: ${{ steps.pick.outputs.arc }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        uses: ghostnet-labs/docs/.github/actions/studio-runners@2fbbfffa8f552c996157e4ae97dcfc6fde490419
        with:
          runner-token: ${{ secrets.RUNNER_READ_TOKEN }}
  gate:
    name: Manet merge gate
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    needs: studio
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.studio.outputs.mac != 'false' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: c6a772c73a9beef0b5f5d57ada16dc2d74fe0415
          persist-credentials: false
      - name: Verify merge policy regression suite
        run: python3 -m unittest discover -s project/tests -v
      - name: Wait for applicable current-head tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 project/scripts/merge_policy.py gate --repo "$REPO" --pr "$PR" --sha "$SHA"
