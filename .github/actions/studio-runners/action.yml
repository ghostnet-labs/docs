name: Studio runners
description: >-
  Says which Mac Studio runner pools are online (mac, arc, build), so a job can
  fall back to a GitHub-hosted runner while its pool is offline. Never fails:
  a missing answer keeps the self-hosted route. See tools/studio-runners.
inputs:
  runner-token:
    description: RUNNER_READ_TOKEN (org "Self-hosted runners" read). Optional; without it the repo's own queued jobs decide.
    required: false
    default: ""
  github-token:
    description: Token for this repository's Actions runs (actions read).
    required: false
    default: ${{ github.token }}
outputs:
  mac:
    description: "'false' while the Studio's macOS runners are offline"
    value: ${{ steps.check.outputs.mac }}
  arc:
    description: "'false' while the ARC pools (ghostnet-linux-arm64, -large, ghostnet-gate) are offline"
    value: ${{ steps.check.outputs.arc }}
  build:
    description: "'false' while every OpenWrt build runner is offline"
    value: ${{ steps.check.outputs.build }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNNER_READ_TOKEN: ${{ inputs.runner-token }}
      run: python3 "$GITHUB_ACTION_PATH/../../../tools/studio-runners/studio_runners.py" pick --repo "$GITHUB_REPOSITORY"
