<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>NanoPC-T6 LTS bench node topology</title>
  <rect width="860" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- power chain -->
  <rect x="20" y="40" width="130" height="62" fill="#fbf0d6" stroke="#9a6a00"/>
  <text x="85" y="66" text-anchor="middle" font-size="14" font-weight="bold">3S pack</text>
  <text x="85" y="86" text-anchor="middle" font-size="12">9.0 to 12.6 V</text>
  <rect x="185" y="40" width="130" height="62" fill="#fbf0d6" stroke="#9a6a00"/>
  <text x="250" y="66" text-anchor="middle" font-size="14" font-weight="bold">LM74700</text>
  <text x="250" y="86" text-anchor="middle" font-size="12">ideal diode (required)</text>
  <rect x="350" y="40" width="130" height="62" fill="#fbf0d6" stroke="#9a6a00"/>
  <text x="415" y="66" text-anchor="middle" font-size="14" font-weight="bold">INA228</text>
  <text x="415" y="86" text-anchor="middle" font-size="12">15 mΩ, I2C8 pins 3/5</text>
  <line x1="150" y1="71" x2="183" y2="71" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="315" y1="71" x2="348" y2="71" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <path d="M480,71 H560 V150" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="566" y="112" font-size="12">5.5 x 2.1 mm jack, 5 to 20 V,</text>
  <text x="566" y="128" font-size="12">no reverse-polarity protection</text>

  <!-- board -->
  <rect x="300" y="152" width="540" height="290" fill="#e3efe7" stroke="#2f6b4a" stroke-width="2"/>
  <text x="318" y="176" font-size="15" font-weight="bold">NanoPC-T6 LTS (RK3588, 4 GB, 64 GB eMMC)</text>

  <rect x="318" y="194" width="235" height="96" fill="#fff" stroke="#2f6b4a"/>
  <text x="330" y="216" font-size="13" font-weight="bold">M.2 E-key (underside)</text>
  <text x="330" y="236" font-size="12">AW7916-AED, PCIe 2.1 x1</text>
  <text x="330" y="254" font-size="12">3.3 V / 3 A MP2143 rail</text>
  <text x="330" y="272" font-size="12">3052 card: needs a hold-down</text>

  <rect x="573" y="194" width="250" height="96" fill="#fff" stroke="#2f6b4a"/>
  <text x="585" y="216" font-size="13" font-weight="bold">40-pin header: GNSS</text>
  <text x="585" y="236" font-size="12">MAX-M10S NMEA: pins 8/10 = ttyS0</text>
  <text x="585" y="254" font-size="12">PPS: pin 12 GPIO3_B7 = /dev/pps0</text>
  <text x="585" y="272" font-size="12">3.3 V pin 1 (0.5 A budget)</text>

  <rect x="318" y="306" width="235" height="118" fill="#fff" stroke="#2f6b4a"/>
  <text x="330" y="328" font-size="13" font-weight="bold">USB and other I/O</text>
  <text x="330" y="348" font-size="12">USB 2.0: Pier42 carrier + GW16167</text>
  <text x="330" y="366" font-size="12">2x 2.5 GbE: eth0 LAN, eth1 WAN</text>
  <text x="330" y="384" font-size="12">USB-C debug console, 1500000 baud</text>
  <text x="330" y="402" font-size="12">no 2280 NVMe with a 3052 card</text>

  <rect x="573" y="306" width="250" height="118" fill="#fff" stroke="#2f6b4a"/>
  <text x="585" y="328" font-size="13" font-weight="bold">Software (nanopc-t6 image)</text>
  <text x="585" y="348" font-size="12">mt7915e + MT7916 firmware</text>
  <text x="585" y="366" font-size="12">kmod-mm8108 (USB)</text>
  <text x="585" y="384" font-size="12">pps-gpio, gpsd on /dev/ttyS0</text>
  <text x="585" y="402" font-size="12">ina238 driver binds the INA228</text>

  <!-- antennas -->
  <rect x="20" y="194" width="230" height="230" fill="#eceeed" stroke="#6b746f"/>
  <text x="32" y="216" font-size="13" font-weight="bold">Antennas (300 mm bar)</text>
  <text x="32" y="240" font-size="12">x = 0: HaLow whip (GW16167)</text>
  <text x="32" y="262" font-size="12">x = 90, 150, 210 mm:</text>
  <text x="32" y="280" font-size="12">  Wi-Fi dipoles (AW7916)</text>
  <text x="32" y="302" font-size="12">x = 300 mm: ANN-MB1 on a</text>
  <text x="32" y="320" font-size="12">  100 mm ground plate</text>
  <text x="32" y="350" font-size="12">Same layout as every track,</text>
  <text x="32" y="368" font-size="12">from the bench compute screen.</text>
  <line x1="250" y1="250" x2="316" y2="250" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="250" y1="330" x2="316" y2="350" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
</svg>
