<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Protectli VP2430 bench node block diagram</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f4f7f5;stroke:#2f6b4a;stroke-width:1.5}
    .host{fill:#e3efe7;stroke:#2f6b4a;stroke-width:2.5}
    .pwr{fill:#fbf0d6;stroke:#9a6a00;stroke-width:1.5}
    .rf{fill:#e8eefb;stroke:#2f4f9a;stroke-width:1.5}
    .h{font-weight:bold;font-size:14px;fill:#18201c}
    .s{font-size:11.5px;fill:#56635c}
    .w{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .p{stroke:#9a6a00;stroke-width:3;fill:none;marker-end:url(#a)}
    .l{font-size:11px;fill:#333}
  </style>

  <!-- Power chain -->
  <rect class="pwr" x="20" y="40" width="150" height="70"/>
  <text class="h" x="32" y="64">3S Li-ion pack</text>
  <text class="s" x="32" y="82">9.0 to 12.6 V</text>
  <text class="s" x="32" y="98">fused at the pack</text>

  <rect class="pwr" x="200" y="40" width="150" height="70"/>
  <text class="h" x="212" y="64">Ideal diode</text>
  <text class="s" x="212" y="82">LM74700 board</text>
  <text class="s" x="212" y="98">reverse-polarity block</text>

  <rect class="pwr" x="380" y="40" width="150" height="70"/>
  <text class="h" x="392" y="64">INA228</text>
  <text class="s" x="392" y="82">pack V, I, W (15 mΩ)</text>
  <text class="s" x="392" y="98">I2C to MCP2221A</text>

  <rect class="pwr" x="560" y="40" width="170" height="70"/>
  <text class="h" x="572" y="64">Victron Orion-Tr</text>
  <text class="s" x="572" y="82">12/12-9, 8 to 17 V in</text>
  <text class="s" x="572" y="98">12.2 V out, 110 W</text>

  <path class="p" d="M170,75 H198"/>
  <path class="p" d="M350,75 H378"/>
  <path class="p" d="M530,75 H558"/>
  <path class="p" d="M730,75 H800 V158"/>
  <text class="l" x="806" y="120">12 V DC jack</text>

  <!-- Host -->
  <rect class="host" x="330" y="160" width="560" height="250"/>
  <text class="h" x="346" y="186" font-size="16">Protectli Vault Pro VP2430 (Intel N150)</text>
  <text class="s" x="346" y="204">OpenMANET x86_64 image, board x86-64, bsp-x86</text>

  <rect class="rf" x="350" y="222" width="250" height="78"/>
  <text class="h" x="362" y="245">M.2 E-key slot (internal)</text>
  <text class="s" x="362" y="263">AsiaRF AW7916-AED, MT7916</text>
  <text class="s" x="362" y="279">PCIe, mt7915e driver, 802.11s mesh</text>
  <text class="s" x="362" y="294">3052 standoff, 3 IPEX to chassis</text>

  <rect class="box" x="620" y="222" width="250" height="78"/>
  <text class="h" x="632" y="245">4x i226-V 2.5 GbE</text>
  <text class="s" x="632" y="263">port 1 WAN, ports 2-4 LAN</text>
  <text class="s" x="632" y="279">(order to confirm on bench)</text>

  <rect class="box" x="350" y="318" width="160" height="78"/>
  <text class="h" x="362" y="341">USB ports</text>
  <text class="s" x="362" y="359">HaLow carrier</text>
  <text class="s" x="362" y="375">MCP2221A, OpenVLM</text>

  <rect class="box" x="530" y="318" width="160" height="78"/>
  <text class="h" x="542" y="341">COM2 header</text>
  <text class="s" x="542" y="359">2x5 2.0 mm, /dev/ttyS1?</text>
  <text class="s" x="542" y="375">pin 2 RX, 3 TX, 1 DCD</text>

  <rect class="box" x="710" y="318" width="160" height="78"/>
  <text class="h" x="722" y="341">USB-C console</text>
  <text class="s" x="722" y="359">/dev/ttyS0, 115200 8N1</text>
  <text class="s" x="722" y="375">laptop on the bench</text>

  <!-- Peripherals -->
  <rect class="rf" x="20" y="300" width="270" height="70"/>
  <text class="h" x="32" y="324">Gateworks GW16167 HaLow</text>
  <text class="s" x="32" y="342">MM8108 on Pier42 USB carrier</text>
  <text class="s" x="32" y="358">kmod-mm8108, 26 dBm</text>
  <path class="w" d="M290,335 H348"/>

  <rect class="box" x="20" y="390" width="270" height="56"/>
  <text class="h" x="32" y="414">Adafruit MCP2221A</text>
  <text class="s" x="32" y="432">USB-I2C (hid-mcp2221) to INA228</text>
  <path class="w" d="M290,418 H320 V380 H348"/>
  <path class="w" d="M455,110 V130 H8 V418 H18" stroke-dasharray="5 4"/>
  <text class="l" x="200" y="146">I2C (STEMMA QT) to the MCP2221A</text>

  <rect class="box" x="380" y="460" width="230" height="78"/>
  <text class="h" x="392" y="483">MAX3232 breakout</text>
  <text class="s" x="392" y="501">3.3 V TTL to RS-232 levels</text>
  <text class="s" x="392" y="517">PPS (inverted) to DCD</text>
  <path class="w" d="M560,460 V398"/>
  <text class="l" x="566" y="440">2.0 mm jumpers</text>

  <rect class="rf" x="660" y="460" width="270" height="78"/>
  <text class="h" x="672" y="483">u-blox MAX-M10S breakout</text>
  <text class="s" x="672" y="501">SparkFun, 3.3 V, UART + TIMEPULSE</text>
  <text class="s" x="672" y="517">ANN-MB1 active antenna, 1 ft from radios</text>
  <path class="w" d="M658,499 H612"/>
</svg>
